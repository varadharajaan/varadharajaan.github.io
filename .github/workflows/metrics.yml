name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    if: github.repository == 'varadharajaan/varadharajaan.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check configuration
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add a scopeless classic PAT as the METRICS_TOKEN repository secret."
            exit 1
          fi

      - name: Render contribution calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: varadharajaan
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: assets/metrics-calendar.svg
          template: classic
          base: ""
          repositories_affiliations: owner
          repositories_forks: "no"
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          config_animations: "no"
          config_base64: "yes"
          output_action: commit
          output_condition: data-changed
          plugins_errors_fatal: "yes"
          use_prebuilt_image: "no"

      - name: Render repository languages
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          user: varadharajaan
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          filename: assets/metrics-languages.svg
          template: classic
          base: ""
          repositories_affiliations: owner
          repositories_forks: "no"
          plugin_languages: "yes"
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_indepth: "no"
          config_timezone: Asia/Kolkata
          config_animations: "no"
          config_base64: "yes"
          output_action: commit
          output_condition: data-changed
          plugins_errors_fatal: "yes"
          use_prebuilt_image: "no"